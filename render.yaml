services:
  - type: web
    name: gis-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gis-3-0khh.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
